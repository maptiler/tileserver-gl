name: Create bump version PR
on:
  schedule:
    # Cut a stable release every month so dependency and security updates
    # merged into master reach the `latest` npm tag and Docker images.
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: Version bump type.
        required: true
        type: choice
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major
      preid:
        description: Prerelease identifier (e.g., 'alpha', 'beta', 'rc'). Only used with prerelease version types.
        required: false
        type: string
        default: 'pre'
jobs:
  bump-version-pr:
    name: Bump version PR
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master
      - name: Resolve release type
        id: release-type
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PREID: ${{ inputs.preid }}
        run: |
          # How long to leave a fresh prerelease or major dependency bump alone
          # before a scheduled run will promote it to stable.
          SETTLE_DAYS=7

          bump="$INPUT_VERSION"
          preid="$INPUT_PREID"

          # Manual dispatch uses whatever was asked for.
          if [ -n "$bump" ]; then
            echo "Manual dispatch: bump=$bump preid=${preid:-<none>}"
            echo "bump=$bump" >> "$GITHUB_OUTPUT"
            echo "preid=$preid" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled runs always cut a stable release, so measure from the last
          # stable tag rather than the last tag, which is usually a prerelease.
          tags="$( git tag --list 'v*' --sort=-v:refname )"
          lastStable="$( awk '!/-/ { print; exit }' <<< "$tags" )"
          range="${lastStable:+$lastStable..}HEAD"
          echo "Considering everything since ${lastStable:-the first commit}"

          if [ "$( git rev-list --count "$range" )" -eq 0 ]; then
            echo "Nothing new to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          log="$( git log "$range" --format='%s%n%b' )"

          # Never let the schedule turn a breaking change into a minor release.
          if grep -qE '^[a-z]+(\(.+\))?!:|^BREAKING[ -]CHANGE' <<< "$log"; then
            echo "Breaking changes present, a major release has to be dispatched manually."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now="$( date +%s )"

          # Cutting a prerelease means "not stable yet", so don't overrule a
          # recent one a few days later.
          lastTag="$( git describe --tags --abbrev=0 2>/dev/null || true )"
          case "$lastTag" in
            *-*)
              age=$(( ( now - $( git log -1 --format=%ct "$lastTag" ) ) / 86400 ))
              if [ "$age" -lt "$SETTLE_DAYS" ]; then
                echo "$lastTag was cut ${age}d ago, leaving it to settle."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac

          # Major dependency bumps aren't routine. 5.0.0 came out of a
          # Maplibre-Native update, which is how breaking changes tend to
          # reach this project, so give them the same wait.
          majorDep="$( git log "$range" -1 --fixed-strings --grep='version-update:semver-major' --format='%ct' )"
          if [ -n "$majorDep" ]; then
            age=$(( ( now - majorDep ) / 86400 ))
            if [ "$age" -lt "$SETTLE_DAYS" ]; then
              echo "A major dependency bump landed ${age}d ago, letting it settle."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -n "$majorDep" ] || grep -qE '^feat(\(.+\))?:' <<< "$log"; then
            bump=minor
          else
            bump=patch
          fi

          echo "Scheduled release: $bump"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "preid=" >> "$GITHUB_OUTPUT"
      - name: Setup node env 📦
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          check-latest: true
          cache: 'npm'
      - name: Create bump script
        if: steps.release-type.outputs.skip != 'true'
        run: |
          cat > bump-version.mjs << 'EOF'
          import { execSync } from 'child_process';
          import * as fs from 'fs';

          const versionType = process.argv[2];
          const preid = process.argv[3];
          const changelogPath = 'CHANGELOG.md';

          let newVersion = '';

          // Build npm version command
          let versionCmd = `npm version --commit-hooks false --git-tag-version false ${versionType}`;
          if (preid && preid.trim() !== '') {
            versionCmd += ` --preid=${preid}`;
            console.log(`Using preid: ${preid}`);
          }

          console.log('Bumping version in root package.json');
          execSync(versionCmd, {
            stdio: 'inherit'
          });

          // Get the new version
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          newVersion = packageJson.version;

          console.log(`New version: ${newVersion}`);

          // Update changelog
          console.log(`Checking for changelog at: ${changelogPath}`);
          if (!fs.existsSync(changelogPath)) {
            console.log(`No changelog found at ${changelogPath}, skipping changelog update`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${newVersion}\n`);
            process.exit(0);
          }

          let changelog = fs.readFileSync(changelogPath, 'utf8');

          // Get PRs since last tag
          console.log('Fetching PRs since last tagged version...');
          let latestTag;
          try {
            latestTag = execSync('git describe --tags --abbrev=0', { encoding: 'utf8' }).trim();
            console.log(`Latest tag: ${latestTag}`);
          } catch (error) {
            console.log('No previous tags found, using all commits');
            latestTag = '';
          }

          // Get commit range
          const commitRange = latestTag ? `${latestTag}..HEAD` : 'HEAD';
          
          // Get all PR numbers from commit messages
          let commits;
          try {
            commits = execSync(`git log ${commitRange} --oneline`, { encoding: 'utf8' });
          } catch (error) {
            console.log('No commits found');
            commits = '';
          }

          // Extract PR numbers from merge commits
          const prNumbers = [];
          const prRegex = /#(\d+)/g;
          let match;
          while ((match = prRegex.exec(commits)) !== null) {
            prNumbers.push(match[1]);
          }

          console.log(`Found ${prNumbers.length} PRs since last tag`);

          // Check which PR numbers are missing from changelog
          const missingPrNumbers = prNumbers.filter(prNum => !changelog.includes(`#${prNum}`));
          const missingEntries = [];
          
          if (missingPrNumbers.length === 0) {
            console.log('All PRs are already in the changelog');
          } else {
            console.log(`Found ${missingPrNumbers.length} missing PRs, fetching details...`);

            // Get repository info for PR links
            let repoFullName;
            try {
              const remoteUrl = execSync('git config --get remote.origin.url', { encoding: 'utf8' }).trim();
              const repoMatch = remoteUrl.match(/github\.com[:/](.+?)(?:\.git)?$/);
              repoFullName = repoMatch ? repoMatch[1] : null;
            } catch (error) {
              console.log('Could not determine repository name');
              repoFullName = null;
            }

            // Fetch PR details using gh CLI only for missing PRs
            for (const prNumber of missingPrNumbers) {
              try {
                const prJson = execSync(`gh pr view ${prNumber} --json title,author,number`, { encoding: 'utf8' });
                const pr = JSON.parse(prJson);
                
                // Skip dependabot PRs
                if (pr.author.login.includes('dependabot')) {
                  console.log(`Skipping dependabot PR #${prNumber}`);
                  continue;
                }

                const prUrl = repoFullName ? `https://github.com/${repoFullName}/pull/${pr.number}` : `#${pr.number}`;
                const entry = `- ${pr.title} ([#${pr.number}](${prUrl})) (by [${pr.author.login}](https://github.com/${pr.author.login}))`;
                missingEntries.push(entry);
                console.log(`Added: ${entry}`);
              } catch (error) {
                console.log(`Could not fetch details for PR #${prNumber}: ${error.message}`);
              }
            }
          }
          
          // Replace "## master" with the new version number
          changelog = changelog.replace('## master', `## ${newVersion}`);
          
          // Remove placeholder lines
          changelog = changelog.replaceAll('- _...Add new stuff here..._\n', '');
          
          // Build the new master section header (using array join to avoid YAML issues)
          const masterSection = [
            '## master',
            '### ✨ Features and improvements',
            '- _...Add new stuff here..._',
            '',
            '### 🐞 Bug fixes',
            '- _...Add new stuff here..._',
            '',
            ''
          ].join('\n');
          
          // Find where the content starts after the title header
          // Expected format: "# tileserver-gl changelog\n\n## <version>"
          const titleMatch = changelog.match(/^(# .+?\n\n)/);
          let title = '';
          let rest = changelog;
          
          if (titleMatch) {
            title = titleMatch[1];
            rest = changelog.slice(title.length);
          }
          
          // Find the end of the new version's Bug fixes section to insert missing entries there
          // Pattern: look for "### 🐞 Bug fixes\n" followed by content until next "## " heading
          if (missingEntries.length > 0) {
            console.log(`Adding ${missingEntries.length} missing PR entries to changelog`);
            const bugFixesPattern = /^(## [^\n]+\n### ✨ Features and improvements\n*### 🐞 Bug fixes\n)/m;
            const bugFixesMatch = rest.match(bugFixesPattern);
            
            if (bugFixesMatch) {
              // Insert entries after the Bug fixes header
              const insertPoint = bugFixesMatch.index + bugFixesMatch[1].length;
              const entriesText = '\n' + missingEntries.join('\n') + '\n';
              rest = rest.slice(0, insertPoint) + entriesText + rest.slice(insertPoint);
            } else {
              // Fallback: just add after version header if pattern not found
              rest = rest + '\n' + missingEntries.join('\n') + '\n';
            }
          }
          
          changelog = title + masterSection + rest;
          
          fs.writeFileSync(changelogPath, changelog, 'utf8');
          console.log(`Changelog updated at ${changelogPath}`);

          // Write outputs to GITHUB_OUTPUT
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${newVersion}\n`);
          EOF
      - name: Bump version and update changelog
        id: version-details
        if: steps.release-type.outputs.skip != 'true'
        run: |
          node bump-version.mjs "$BUMP" "$PREID"
          rm bump-version.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ steps.release-type.outputs.bump }}
          PREID: ${{ steps.release-type.outputs.preid }}
      - name: Create Pull Request
        if: steps.release-type.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Release v${{ steps.version-details.outputs.version }}
          branch: release-v${{ steps.version-details.outputs.version }}
          title: Release v${{ steps.version-details.outputs.version }}
